<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 140 140">
  <defs>
    <mask id="cutout">
      <!-- El fondo blanco hace visible todo -->
      <rect x="-20" y="-20" width="140" height="140" fill="white" />
      <!-- El trazo negro recorta un margen transparente alrededor de la figura azul -->
      <path d="M 5 110 L 45 20 L 75 60" fill="none" stroke="black" stroke-width="44" stroke-linejoin="miter" stroke-miterlimit="10"/>
    </mask>
  </defs>
  
  <!-- Pieza Dorada (atrás, con recorte donde cruza) -->
  <path d="M 25 40 L 55 80 L 95 -10" fill="none" stroke="#C69C25" stroke-width="30" stroke-linejoin="miter" stroke-miterlimit="10" mask="url(#cutout)"/>
  
  <!-- Pieza Azul Marina (frente) -->
  <path d="M 5 110 L 45 20 L 75 60" fill="none" stroke="#002244" stroke-width="30" stroke-linejoin="miter" stroke-miterlimit="10"/>
</svg>
